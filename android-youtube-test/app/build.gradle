plugins {
    id 'com.android.application'
}

android {
    namespace 'it.geovision.test'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/geovision-debug-stable.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'it.geovision.test.photolab'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-v138-photo-uri-lab'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
