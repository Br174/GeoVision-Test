plugins {
    id 'com.android.application'
}

android {
    namespace 'it.geovision.test'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../signing/geovision-debug-stable.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'it.geovision.test'
        minSdk 23
        targetSdk 35
        versionCode 147
        versionName '1.47-territory-result-photos'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
