plugins {
    id 'com.android.application'
}

android {
    namespace 'it.geovision.keybox'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('../../android-youtube-test/signing/geovision-debug-stable.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'it.geovision.keybox'
        minSdk 23
        targetSdk 35
        versionCode 2005
        versionName '5.0-recovery-simple'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}
