name: LAB 049 AUDIO FAST
'on':
  push:
    branches: ['lab/audio-fast-049']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB049 from verified LAB048 chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          python monitor010/patch_search_audio_045.py
          python monitor010/patch_context_clean_046.py
          python monitor010/patch_social_composite_047.py
          python monitor010/patch_audio_fast_049.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.audiofast049/; s/versionCode 2012/versionCode 2049/; s/1.0-failover-012/1.0-audio-fast-049/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 049 AUDIO FAST/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text()
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()
          checks={
            'no artificial guide lead': 'const lead = gv043GuideLead(p);' not in h,
            'prefetch cache': 'const gv049GuideCache=new Map();' in h,
            'silent auto retry': 'continuation=await gv043PreloadGuide(p,true);' in h,
            'no raw HTTP error in guide': "Audioguida non disponibile.<br><small>" not in h,
            'social composite preserved': 'function platformQuery047()' in h,
            'shorts preserved': "data-p=\"shorts\"" in h,
            'KeyBox bridge preserved': 'Importa da KeyBox' in h,
            'fast model': 'gemini-3.5-flash-lite' in j,
            'lite fallback': 'gemini-2.5-flash-lite' in j,
            'dead Gemini 2.0 removed': 'gemini-2.0-flash' not in j,
            'package': "applicationId 'it.geovision.lab.audiofast049'" in g,
            'version': 'versionCode 2049' in g,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad,bad
          print('LAB049 regression checks OK:',len(checks))
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksig.txt
          grep -qi '716c1a8a139ad956ef8a00f85f153eb0028d109c75b1b938bdf3bb3eb23c22b5' /tmp/apksig.txt
          "$ZIPALIGN" -c -p 4 "$APK"
          python - <<'PY'
          import zipfile,os,hashlib
          apk='android-youtube-test/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ['AndroidManifest.xml','classes.dex','resources.arsc','assets/geovision.html']:
                  assert req in names,req
              h=z.read('assets/geovision.html').decode('utf-8')
              assert 'const gv049GuideCache=new Map();' in h
              assert 'function platformQuery047()' in h
          print('APK integrity OK',os.path.getsize(apk),hashlib.sha256(open(apk,'rb').read()).hexdigest())
          PY
          mkdir -p out49
          cp "$APK" out49/GeoVision_LAB049_AUDIO_FAST.apk
          cp out/LAB_012_FAILOVER.html out49/GeoVision_LAB049_AUDIO_FAST.html
          cd out49
          zip GeoVision_LAB049_AUDIO_FAST_APK.zip GeoVision_LAB049_AUDIO_FAST.apk
          zip GeoVision_LAB049_AUDIO_FAST_PACKAGE.zip GeoVision_LAB049_AUDIO_FAST.apk GeoVision_LAB049_AUDIO_FAST.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-049-AUDIO-FAST
          path: |
            out49/GeoVision_LAB049_AUDIO_FAST.apk
            out49/GeoVision_LAB049_AUDIO_FAST_APK.zip
            out49/GeoVision_LAB049_AUDIO_FAST_PACKAGE.zip
          if-no-files-found: error
