name: Build KEYBOX 005 RECOVERY

on:
  push:
    branches:
      - keybox/005-recovery-simple
    paths:
      - 'android-keybox/**'
      - '.github/workflows/build-geovision-keybox-005-recovery.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build recovery KeyBox
        run: bash android-keybox/build_keybox_005_recovery.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_KEYBOX_005_RECOVERY
          path: GeoVision_KEYBOX_005_RECOVERY.zip
          if-no-files-found: error
