name: Build GeoVision LAB KEY FAILOVER 004 BOOTSAFE

on:
  push:
    branches:
      - lab/google-key-failover-004-bootsafe
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build clean boot-safe Google key failover LAB 004
        run: bash android-youtube-test/madre001/build_lab_google_key_failover_004.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_KEY_FAILOVER_004_BOOTSAFE
          path: |
            GeoVision_LAB_KEY_FAILOVER_004_BOOTSAFE.apk
            GeoVision_LAB_KEY_FAILOVER_004_BOOTSAFE.html
            GeoVision_LAB_KEY_FAILOVER_004_BOOTSAFE.zip
            MANIFEST_LAB_KEY_FAILOVER_004_BOOTSAFE.txt
          if-no-files-found: error
