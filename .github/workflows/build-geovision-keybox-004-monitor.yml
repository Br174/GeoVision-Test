name: Build KEYBOX 004 MONITOR

on:
  push:
    branches:
      - keybox/003-monitor
    paths:
      - 'android-youtube-test/madre001/build_keybox_004_full_monitor.sh'
      - '.github/workflows/build-geovision-keybox-004-monitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build KEYBOX 004 MONITOR
        run: bash android-youtube-test/madre001/build_keybox_004_full_monitor.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_KEYBOX_004_MONITOR
          path: |
            GeoVision_KEYBOX_004_MONITOR.apk
            GeoVision_KEYBOX_004_MONITOR.zip
            README_KEYBOX_004_MONITOR.txt
          if-no-files-found: error
