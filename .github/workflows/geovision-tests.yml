name: GeoVision HTML tests

on:
  push:
    paths:
      - "GeoVision_Nova_v114_AI_RAPIDA_APPROFONDIMENTO.html"
      - "tests/test_geovision.py"
      - ".github/workflows/geovision-tests.yml"
  pull_request:
    paths:
      - "GeoVision_Nova_v114_AI_RAPIDA_APPROFONDIMENTO.html"
      - "tests/test_geovision.py"
      - ".github/workflows/geovision-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run GeoVision checks
        run: python tests/test_geovision.py
