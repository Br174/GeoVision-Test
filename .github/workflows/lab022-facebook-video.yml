name: LAB 022 FACEBOOK VIDEO
on:
  push:
    branches: ['lab/facebook-video-022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare source and inspect Facebook wiring
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          echo '--- FACEBOOK MATCHES ---'
          python - <<'PY'
          from pathlib import Path
          s=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          low=s.lower()
          pos=0
          found=0
          while True:
              i=low.find('facebook',pos)
              if i<0: break
              found+=1
              print(f'\n--- match {found} at {i} ---')
              print(s[max(0,i-500):min(len(s),i+900)])
              pos=i+8
          print('\nTOTAL',found)
          PY
