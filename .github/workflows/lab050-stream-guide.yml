name: LAB 050 STREAM GUIDE
'on':
  push:
    branches: ['lab/stream-guide-050']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB050 from LAB049 chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          python monitor010/patch_search_audio_045.py
          python monitor010/patch_context_clean_046.py
          python monitor010/patch_social_composite_047.py
          python monitor010/patch_audio_fast_049.py
          python monitor010/patch_stream_guide_social_050.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.streamguide050xx/; s/versionCode 2012/versionCode 2050/; s/1.0-failover-012/1.0-guide-block-direct-050/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 050 STREAM GUIDE AI/' android-youtube-test/app/src/main/AndroidManifest.xml
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p out50
          cp "$APK" out50/GeoVision_LAB050_STREAM_GUIDE.apk
          cp out/LAB_012_FAILOVER.html out50/GeoVision_LAB050_STREAM_GUIDE.html
          cd out50 && zip GeoVision_LAB050_STREAM_GUIDE_APK.zip GeoVision_LAB050_STREAM_GUIDE.apk && zip GeoVision_LAB050_STREAM_GUIDE_PACKAGE.zip GeoVision_LAB050_STREAM_GUIDE.apk GeoVision_LAB050_STREAM_GUIDE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-050-STREAM-GUIDE
          path: |
            out50/GeoVision_LAB050_STREAM_GUIDE.apk
            out50/GeoVision_LAB050_STREAM_GUIDE_APK.zip
            out50/GeoVision_LAB050_STREAM_GUIDE_PACKAGE.zip
          if-no-files-found: error
