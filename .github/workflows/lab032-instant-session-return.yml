name: LAB 032 INSTANT SESSION RETURN
on:
  push:
    branches: ['lab/instant-session-return-032']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB032
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_instant_session_return_032.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.instantsession032/; s/versionCode 2012/versionCode 2032/; s/1.0-failover-012/1.0-instant-session-032/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 032 INSTANT SESSION RETURN/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          assert 'task.moveToFront()' in j
          assert 'SpannableString("●")' in j
          assert 'gv032-external-return' in h
          assert 'FLAG_ACTIVITY_CLEAR_TOP' not in j
          print('LAB032 checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out32
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out32/LAB_032_INSTANT_SESSION_RETURN.apk
          cp out/LAB_012_FAILOVER.html out32/LAB_032_INSTANT_SESSION_RETURN.html
          cd out32 && zip LAB_032_INSTANT_SESSION_RETURN_PACKAGE.zip LAB_032_INSTANT_SESSION_RETURN.apk LAB_032_INSTANT_SESSION_RETURN.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-032-INSTANT-SESSION-RETURN
          path: out32/LAB_032_INSTANT_SESSION_RETURN_PACKAGE.zip
          if-no-files-found: error
