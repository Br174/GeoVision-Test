name: Build GeoVision MADRE 001 ISOLATA FIXED

on:
  push:
    branches:
      - candidate/madre-001-v79-isolata
    paths:
      - 'android-youtube-test/madre001/build_madre001.sh'
      - '.github/workflows/build-geovision-madre001-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct validate build verify package
        run: bash android-youtube-test/madre001/build_madre001.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_MADRE_001_CORE_STABILE
          path: |
            GeoVision_MADRE_001_CORE_STABILE.apk
            GeoVision_MADRE_001_CORE_STABILE.html
            GeoVision_MADRE_001_CORE_STABILE.zip
            MANIFEST_MADRE_001.txt
          if-no-files-found: error
