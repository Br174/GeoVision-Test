name: Build GeoVision LAB 001 BASE MADRE001

on:
  push:
    branches:
      - lab/madre001-base-001
    paths:
      - 'android-youtube-test/madre001/build_lab_madre001_base_001.sh'
      - '.github/workflows/build-geovision-lab-madre001-base-001.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean LAB 001 from approved Mother 001
        run: bash android-youtube-test/madre001/build_lab_madre001_base_001.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_001_BASE_MADRE001
          path: |
            GeoVision_LAB_001_BASE_MADRE001.apk
            GeoVision_LAB_001_BASE_MADRE001.html
            GeoVision_LAB_001_BASE_MADRE001.zip
            MANIFEST_LAB_001_BASE_MADRE001.txt
          if-no-files-found: error
