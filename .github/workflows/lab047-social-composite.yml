name: LAB 047 SOCIAL COMPOSITE
'on':
  push:
    branches: ['lab/social-composite-047']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB047 from LAB046 chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          python monitor010/patch_search_audio_045.py
          python monitor010/patch_context_clean_046.py
          python monitor010/patch_social_composite_047.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.socialcomposite047/; s/versionCode 2012/versionCode 2047/; s/1.0-failover-012/1.0-social-composite-047/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 047 SOCIAL COMPOSITE/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()
          m=Path('android-youtube-test/app/src/main/AndroidManifest.xml').read_text()
          assert 'function platformQuery047()' in h
          assert 'const sq = platformQuery047();' in h
          assert 'const yq = platformQuery047();' in h
          assert 'const fq=platformQuery047();' in h
          assert "(p === 'instagram' || p === 'tiktok') ? platformQuery047()" in h
          assert "return [manual,poi,place].filter(Boolean).join(' ');" in h
          assert 'function platformQuery046()' in h
          assert "applicationId 'it.geovision.lab.socialcomposite047'" in g
          assert 'versionCode 2047' in g
          assert 'LAB 047 SOCIAL COMPOSITE' in m
          print('LAB047 pre-build checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          python - <<'PY'
          import zipfile,os
          apk='android-youtube-test/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              h=z.read('assets/geovision.html').decode('utf-8')
              assert 'function platformQuery047()' in h
              assert 'const sq = platformQuery047();' in h
              assert 'const yq = platformQuery047();' in h
              assert 'const fq=platformQuery047();' in h
          print('LAB047 APK integrity OK',os.path.getsize(apk))
          PY
          mkdir -p out47
          cp "$APK" out47/GeoVision_LAB047_SOCIAL_COMPOSITE.apk
          cp out/LAB_012_FAILOVER.html out47/GeoVision_LAB047_SOCIAL_COMPOSITE.html
          cd out47
          zip GeoVision_LAB047_APK.zip GeoVision_LAB047_SOCIAL_COMPOSITE.apk
          zip GeoVision_LAB047_PACKAGE.zip GeoVision_LAB047_SOCIAL_COMPOSITE.apk GeoVision_LAB047_SOCIAL_COMPOSITE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-047-SOCIAL-COMPOSITE
          path: |
            out47/GeoVision_LAB047_SOCIAL_COMPOSITE.apk
            out47/GeoVision_LAB047_APK.zip
            out47/GeoVision_LAB047_PACKAGE.zip
          if-no-files-found: error
