name: Build GeoVision LAB KEY FAILOVER 003 CLEAN

on:
  push:
    branches:
      - lab/google-key-failover-003-clean
    paths:
      - 'android-youtube-test/madre001/**'
      - '.github/workflows/build-geovision-lab-key-failover-003-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean isolated Google key failover LAB 003
        run: bash android-youtube-test/madre001/build_lab_google_key_failover_003_clean.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_KEY_FAILOVER_003_CLEAN
          path: |
            GeoVision_LAB_KEY_FAILOVER_003_CLEAN.apk
            GeoVision_LAB_KEY_FAILOVER_003_CLEAN.html
            GeoVision_LAB_KEY_FAILOVER_003_CLEAN.zip
            MANIFEST_LAB_KEY_FAILOVER_003_CLEAN.txt
          if-no-files-found: error
