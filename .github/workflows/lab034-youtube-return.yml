name: LAB 034 YOUTUBE RETURN
on:
  push:
    branches: ['lab/youtube-return-034']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB034
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_return_034.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.youtubereturn034/; s/versionCode 2012/versionCode 2034/; s/1.0-failover-012/1.0-youtube-return-034/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 034 YOUTUBE RETURN/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          assert 'gv034-youtube-return' in h
          assert "if (p === 'youtube')" in h
          assert 'gv029ShowReturnBubble();' in h
          assert 'task.moveToFront()' not in j
          assert 'ActivityManager.AppTask' not in j
          print('LAB034 YouTube-only checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out34
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out34/LAB_034_YOUTUBE_RETURN.apk
          cp out/LAB_012_FAILOVER.html out34/LAB_034_YOUTUBE_RETURN.html
          cd out34 && zip LAB_034_YOUTUBE_RETURN_PACKAGE.zip LAB_034_YOUTUBE_RETURN.apk LAB_034_YOUTUBE_RETURN.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-034-YOUTUBE-RETURN
          path: out34/LAB_034_YOUTUBE_RETURN_PACKAGE.zip
          if-no-files-found: error
