name: LAB 028 MEDIA GOOGLE CARD
on:
  push:
    branches: ['lab/media-googlecard-028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - name: Build LAB028
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.mediagooglecard028/; s/versionCode 2012/versionCode 2028/; s/1.0-failover-012/1.0-media-google-card-028/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 028 MEDIA GOOGLE CARD/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          assert 'function gv028EnsureGoogleCard(p)' in h
          assert 'gv027StopGuideForMedia();' in h
          assert "function launchPlatform(p) {\n  gv027StopGuideForMedia();" not in h
          assert "gv027StopGuideForMedia(); $('#videoPicker')" not in h
          assert 'renderOfficialGoogleCard' in h
          print('LAB028 static checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out28
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out28/LAB_028_MEDIA_GOOGLE_CARD.apk
          cp out/LAB_012_FAILOVER.html out28/LAB_028_MEDIA_GOOGLE_CARD.html
          cd out28 && zip LAB_028_MEDIA_GOOGLE_CARD_PACKAGE.zip LAB_028_MEDIA_GOOGLE_CARD.apk LAB_028_MEDIA_GOOGLE_CARD.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-028-MEDIA-GOOGLE-CARD
          path: out28/LAB_028_MEDIA_GOOGLE_CARD_PACKAGE.zip
          if-no-files-found: error
