name: LAB 041 YOUTUBE APP DIRECT REBUILD
on:
  push:
    branches: ['lab/youtube-app-direct-rebuild-041']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB041 from proven LAB037 chain
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_app_direct_041.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.youtubeappdir041/; s/versionCode 2012/versionCode 2041/; s/1.0-failover-012/1.0-youtube-app-direct-041/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 041 YOUTUBE APP DIRECT/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()

          y=h[h.index("if(p === 'youtube') {"):h.index("if(p === 'youtube') {")+650]
          checks = [
              ('direct YouTube intent', 'package=com.google.android.youtube;end' in y),
              ('no browser fallback in YouTube intent', 'browser_fallback_url' not in y),
              ('return bubble kept', 'gv029ShowReturnBubble();' in y),
              ('intent deep-link host kept', 'Intent.parseUri(url, Intent.URI_INTENT_SCHEME)' in j),
              ('external deep-link handler kept', 'openExternalDeepLink' in j),
              ('LAB037 return method kept', 'private void returnToGeoVision()' in j),
              ('LAB037 return flags kept', 'Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_REORDER_TO_FRONT|Intent.FLAG_ACTIVITY_SINGLE_TOP' in j),
              ('bubble hidden on resume', '@Override protected void onResume(){super.onResume();hideReturnBubble();' in j),
              ('new application id', "applicationId 'it.geovision.lab.youtubeappdir041'" in g),
              ('new version code', 'versionCode 2041' in g),
              ('new version name', "versionName '1.0-youtube-app-direct-041'" in g),
          ]
          failed=[name for name,ok in checks if not ok]
          if failed: raise AssertionError('LAB041 checks failed: '+', '.join(failed))
          assert 'task.moveToFront()' not in j and 'ActivityManager.AppTask' not in j
          print('LAB041 pre-build regression checks OK:', len(checks))
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python - <<'PY'
          import zipfile, os
          apk='android-youtube-test/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              assert bad is None, 'Corrupt APK member: '+str(bad)
              names=set(z.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'classes.dex' in names
              assert 'resources.arsc' in names
              html=z.read('assets/geovision.html').decode('utf-8')
              assert 'package=com.google.android.youtube;end' in html
          print('APK ZIP integrity OK', os.path.getsize(apk), 'bytes')
          PY
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p out41
          cp "$APK" out41/LAB_041_YOUTUBE_APP_DIRECT.apk
          cp out/LAB_012_FAILOVER.html out41/LAB_041_YOUTUBE_APP_DIRECT.html
          cd out41 && zip LAB_041_YOUTUBE_APP_DIRECT_PACKAGE.zip LAB_041_YOUTUBE_APP_DIRECT.apk LAB_041_YOUTUBE_APP_DIRECT.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-041-YOUTUBE-APP-DIRECT
          path: out41/LAB_041_YOUTUBE_APP_DIRECT_PACKAGE.zip
          if-no-files-found: error
