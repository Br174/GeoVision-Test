name: KEYBOX 009 IMPORT ONLY
on:
  push:
    branches: ['keybox/009-import-only']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build only
        run: |
          mkdir -p android-youtube-test/signing
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          gradle -p android-keybox clean assembleDebug
          cp android-keybox/app/build/outputs/apk/debug/app-debug.apk KEYBOX_009_IMPORT_ONLY.apk
          printf '%s\n' 'KEYBOX 009 IMPORT ONLY - conserva e invia soltanto Google1 Google2 Google3 AI YouTube. Nessun sync, monitor o failover.' > README_KEYBOX_009.txt
          zip KEYBOX_009_IMPORT_ONLY.zip KEYBOX_009_IMPORT_ONLY.apk README_KEYBOX_009.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEYBOX-009-IMPORT-ONLY
          path: |
            KEYBOX_009_IMPORT_ONLY.apk
            KEYBOX_009_IMPORT_ONLY.zip
            README_KEYBOX_009.txt
