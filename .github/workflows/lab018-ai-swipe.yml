name: LAB 018 AI SWIPE
on:
  push:
    branches: ['lab/ai-swipe-018']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB018 from LAB017 behavior
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.aiguide018/; s/versionCode 2012/versionCode 2018/; s/1.0-failover-012/1.0-ai-swipe-018/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 018 AI SWIPE/' android-youtube-test/app/src/main/AndroidManifest.xml
          gradle -p android-youtube-test assembleDebug
          mkdir -p out18
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out18/LAB_018_AI_SWIPE.apk
          cp out/LAB_012_FAILOVER.html out18/LAB_018_AI_SWIPE.html
          cd out18 && zip LAB_018_AI_SWIPE.zip LAB_018_AI_SWIPE.apk LAB_018_AI_SWIPE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-018-AI-SWIPE
          path: out18/LAB_018_AI_SWIPE.zip
