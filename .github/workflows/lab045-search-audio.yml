name: LAB 045 SEARCH AUDIO
'on':
  push:
    branches: ['lab/search-audio-045']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB045 from LAB044 chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          python monitor010/patch_search_audio_045.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.contextaudio045/; s/versionCode 2012/versionCode 2045/; s/1.0-failover-012/1.0-context-audio-045/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 045 CONTEXT AUDIO/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          assert h.count('function platformQuery045()')==1
          assert 'const sq = platformQuery045();' in h
          assert 'const yq = platformQuery045();' in h
          assert 'gvFacebookLegacySearch(fq)' in h
          assert 'const lead = gv043GuideLead(p);' not in h
          assert 'void enrichNarration(p, guidePromise);' in h
          assert 'data-p="shorts"' in h and 'data-vp="shorts"' in h
          print('LAB045 pre-build checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p out45
          cp "$APK" out45/GeoVision_LAB045_CONTEXT_AUDIO.apk
          cd out45
          zip GeoVision_LAB045_CONTEXT_AUDIO_APK.zip GeoVision_LAB045_CONTEXT_AUDIO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-045-CONTEXT-AUDIO
          path: |
            out45/GeoVision_LAB045_CONTEXT_AUDIO.apk
            out45/GeoVision_LAB045_CONTEXT_AUDIO_APK.zip
          if-no-files-found: error
