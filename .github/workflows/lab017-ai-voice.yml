name: LAB 017 AI VOICE
on:
  push:
    branches: ['lab/ai-voice-auto-017']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB017 automatic AI voice
        run: |
          python monitor010/prepare.py
          python monitor010/patch_tts_swipe_safe_016.py
          python monitor010/patch_ai_voice_auto_017.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.aivoice017/; s/versionCode 2012/versionCode 2017/; s/1.0-failover-012/1.0-ai-voice-017/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 017 AI VOICE/' android-youtube-test/app/src/main/AndroidManifest.xml
          gradle -p android-youtube-test assembleDebug
          mkdir -p out17
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out17/LAB_017_AI_VOICE.apk
          cp out/LAB_012_FAILOVER.html out17/LAB_017_AI_VOICE.html
          cd out17 && zip LAB_017_AI_VOICE.zip LAB_017_AI_VOICE.apk LAB_017_AI_VOICE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-017-AI-VOICE
          path: out17/LAB_017_AI_VOICE.zip
