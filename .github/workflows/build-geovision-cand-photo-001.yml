name: Build CAND 001 FOTO

on:
  push:
    branches:
      - candidate/photo-001
    paths:
      - 'android-youtube-test/madre001/build_candidate_photo_001.sh'
      - 'android-youtube-test/madre001/patch_candidate_photo_001.py'
      - '.github/workflows/build-geovision-cand-photo-001.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build clean CAND 001 FOTO
        run: bash android-youtube-test/madre001/build_candidate_photo_001.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CAND_001_FOTO
          path: |
            CAND_001_FOTO.apk
            CAND_001_FOTO.html
            CAND_001_FOTO.zip
            MANIFEST_CAND_001_FOTO.txt
          if-no-files-found: error
