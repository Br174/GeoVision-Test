name: LAB 030 AUDIO RETURN
on:
  push:
    branches: ['lab/audio-return-030']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB030
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.audioreturn030/; s/versionCode 2012/versionCode 2030/; s/1.0-failover-012/1.0-audio-return-030/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 030 AUDIO RETURN/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text(encoding='utf-8')
          assert '●  GeoVision' in j
          assert 'GradientDrawable' in j and 'TYPE_APPLICATION_OVERLAY' in j
          assert 'stopNative();\n        hideReturnBubble();' in j
          assert 'gv029ShowReturnBubble' in h
          assert "youtube\\.com\\/watch" not in h
          print('LAB030 static checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out30
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out30/LAB_030_AUDIO_RETURN.apk
          cp out/LAB_012_FAILOVER.html out30/LAB_030_AUDIO_RETURN.html
          cd out30 && zip LAB_030_AUDIO_RETURN_PACKAGE.zip LAB_030_AUDIO_RETURN.apk LAB_030_AUDIO_RETURN.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-030-AUDIO-RETURN
          path: out30/LAB_030_AUDIO_RETURN_PACKAGE.zip
          if-no-files-found: error
