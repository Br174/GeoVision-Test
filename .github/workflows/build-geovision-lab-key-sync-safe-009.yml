name: Build LAB 009 KEY SYNC SAFE
on:
  push:
    branches: [ lab/key-sync-safe-009 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Harden LAB 009 patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android-youtube-test/madre001/build_lab_key_sync_safe_009.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace("bootstrap=r'''", "bootstrap='''", 1)
          s=s.replace("ui=r'''", "ui='''", 1)
          old="marker='function openKeysDiagnostics(){'\nif marker not in h: raise SystemExit('diagnostics anchor missing')"
          new="marker='</body>'\nif marker not in h: raise SystemExit('body anchor missing')"
          if old not in s:
              raise SystemExit('build-script diagnostics marker not found')
          s=s.replace(old,new,1)
          old_insert="h=h.replace(marker,ui+'\\n'+marker,1)"
          new_insert="ui += '''\\nsetTimeout(()=>{try{new MutationObserver(()=>gv009Decorate()).observe(document.body,{childList:true,subtree:true});}catch(e){}},0);\\n'''\nh=h.replace(marker,'<script id=\"gv009-monitor-runtime\">'+ui+'</script>\\n'+marker,1)"
          if old_insert not in s:
              raise SystemExit('ui insertion anchor not found')
          s=s.replace(old_insert,new_insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build LAB 009
        run: bash android-youtube-test/madre001/build_lab_key_sync_safe_009.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LAB_009_KEY_SYNC_SAFE
          path: LAB_009_KEY_SYNC_SAFE.zip
