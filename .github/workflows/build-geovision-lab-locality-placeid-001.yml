name: Build GeoVision LAB LOCALITY PLACEID 001
on:
  push:
    branches:
      - lab/madre001-locality-placeid-001
    paths:
      - 'android-youtube-test/madre001/patch_locality_placeid_001.py'
      - 'android-youtube-test/madre001/build_lab_locality_placeid_001.sh'
      - '.github/workflows/build-geovision-lab-locality-placeid-001.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated locality Place ID LAB
        run: bash android-youtube-test/madre001/build_lab_locality_placeid_001.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_LOCALITY_PLACEID_001
          path: |
            GeoVision_LAB_LOCALITY_PLACEID_001.apk
            GeoVision_LAB_LOCALITY_PLACEID_001.html
            GeoVision_LAB_LOCALITY_PLACEID_001.zip
            MANIFEST_LAB_LOCALITY_PLACEID_001.txt
          if-no-files-found: error
