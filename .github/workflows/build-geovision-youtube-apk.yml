name: Build GeoVision v121 Android APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GeoVision v121 HTML
        run: python android-youtube-test/prepare_v118.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-youtube-test
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v121_YouTube_Inline_AI_TTS_Social.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v121_YouTube_Inline_AI_TTS_Social
          path: GeoVision_v121_YouTube_Inline_AI_TTS_Social.apk
          if-no-files-found: error
