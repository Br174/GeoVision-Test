name: Build GeoVision YouTube Test APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GeoVision HTML for Android HTTPS WebView
        shell: python
        run: |
          from pathlib import Path
          src=Path("GeoVision_Nova_v114_AI_RAPIDA_APPROFONDIMENTO.html")
          dst=Path("android-youtube-test/app/src/main/assets/geovision.html")
          dst.parent.mkdir(parents=True,exist_ok=True)
          s=src.read_text(encoding="utf-8")
          if '<meta name="referrer"' not in s:
              s=s.replace('<meta name="viewport"', '<meta name="referrer" content="strict-origin-when-cross-origin">\\n<meta name="viewport"', 1)
          s=s.replace('id="ytModalFrame" style="width:100%;height:100%;border:0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen',
                      'id="ytModalFrame" style="width:100%;height:100%;border:0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen')
          old="document.getElementById('ytModalFrame').src=\`https://www.youtube.com/embed/\${encodeURIComponent(videoId)}?autoplay=1&playsinline=1\`;"
          new="const gvOrigin=(location.protocol==='https:'||location.protocol==='http:')?location.origin:''; document.getElementById('ytModalFrame').referrerPolicy='strict-origin-when-cross-origin'; document.getElementById('ytModalFrame').src=\`https://www.youtube.com/embed/\${encodeURIComponent(videoId)}?autoplay=1&playsinline=1\${gvOrigin?\`&origin=\${encodeURIComponent(gvOrigin)}\`:''}\`;"
          if old not in s:
              raise SystemExit("YouTube player source pattern not found")
          s=s.replace(old,new,1)
          dst.write_text(s,encoding="utf-8")
          print("Prepared",dst,len(s))

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-youtube-test
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v117_YouTube_Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v117_YouTube_Test
          path: GeoVision_v117_YouTube_Test.apk
          if-no-files-found: error
