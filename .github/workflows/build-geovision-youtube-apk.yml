name: Build GeoVision v142 Native Google Photo Tap APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - name: Prepare GeoVision recovery HTML
        run: python android-youtube-test/prepare_v118.py

      - name: Apply v136 exploration visibility patch
        run: python android-youtube-test/patch_v136_exploration_visibility.py

      - name: Apply v137 remove artificial narration intro
        run: python android-youtube-test/patch_v137_remove_intro.py

      - name: Apply v139 automatic Google photo lightbox
        run: python android-youtube-test/patch_v139_auto_google_photo.py

      - name: Apply v140 robust fullscreen photo viewer
        run: python android-youtube-test/patch_v140_fullscreen_photo_viewer.py

      - name: Apply v141 photo wait and retry
        run: python android-youtube-test/patch_v141_photo_wait_retry.py

      - name: Apply v142 native Android Google photo tap
        run: python android-youtube-test/patch_v142_native_google_photo_tap.py

      - name: Assert narration fix and v142 native tap hook
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          java=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text(encoding='utf-8')
          gradle=Path('android-youtube-test/app/build.gradle').read_text(encoding='utf-8')
          forbidden=['Mettetevi comodi','Iniziamo questo viaggio','Siamo a ${p.name}','speak(told);']
          found=[x for x in forbidden if x in html]
          if found:
              raise SystemExit('Artificial narration intro still present: '+repr(found))
          if "function instantNarrationIntro(p) {\n    return '';\n}" not in html:
              raise SystemExit('instantNarrationIntro was not neutralized')
          if 'System.currentTimeMillis()' not in java or 'geovision.html?gv=' not in java:
              raise SystemExit('WebView cache-busting URL is missing')
          required_html=[
              'function gvAutoOpenNativeGooglePhotoV142(p)',
              'window.GeoVisionNativeUI.tapAtCss(x,y,window.devicePixelRatio||1)',
              'void enrichNarration(p); await cardPromise; void gvAutoOpenNativeGooglePhotoV142(p);',
              "toast('Foto: apertura automatica…')"
          ]
          missing=[x for x in required_html if x not in html]
          if missing:
              raise SystemExit('v142 HTML logic missing: '+repr(missing))
          if 'void enrichNarration(p); await cardPromise; void gvAutoOpenPhotoViewerV141(p);' in html:
              raise SystemExit('v141 photo viewer hook is still active')
          required_java=[
              'webView.addJavascriptInterface(new NativeUiBridge(), "GeoVisionNativeUI")',
              'MotionEvent.ACTION_DOWN',
              'MotionEvent.ACTION_UP',
              'InputDevice.SOURCE_TOUCHSCREEN',
              'public void tapAtCss(double xCss, double yCss, double devicePixelRatio)'
          ]
          missing_java=[x for x in required_java if x not in java]
          if missing_java:
              raise SystemExit('v142 native Java bridge missing: '+repr(missing_java))
          if 'versionCode 142' not in gradle:
              raise SystemExit('Android versionCode is not 142')
          print('Narration intro absent: OK')
          print('WebView cache bust active: OK')
          print('v142 native Android touch bridge present: OK')
          print('Storytelling starts before native photo tap: OK')
          print('v141 viewer hook disabled: OK')
          PY

      - name: Validate generated GeoVision JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-youtube-test/app/src/main/assets/geovision.html')
          s=p.read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/geovision-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('HTML bytes:',p.stat().st_size,'script blocks:',len(blocks))
          PY
          node --check /tmp/geovision-check.js

      - name: Rebuild launcher icon from repository Base64
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, re, io
          b64_path=Path('android-youtube-test/icon/geovision_icon.png.b64')
          raw=b64_path.read_text(encoding='utf-8-sig',errors='ignore')
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
          decoded=None
          for trim in range(4):
              candidate=clean[:-trim] if trim else clean
              candidate=candidate.rstrip('=')
              candidate += '='*((4-len(candidate)%4)%4)
              try:
                  data=base64.b64decode(candidate,validate=True)
                  Image.open(io.BytesIO(data)).verify()
                  decoded=data
                  print('Recovered Base64 with tail trim:',trim,'decoded bytes:',len(data))
                  break
              except Exception as e:
                  print('Decode attempt',trim,'failed:',type(e).__name__,str(e)[:140])
          if decoded is None:
              raise SystemExit('Repository Base64 icon is corrupted and cannot be decoded safely')
          src=Image.open(io.BytesIO(decoded)).convert('RGBA')
          if src.size != (512,512):
              src=src.resize((512,512),Image.Resampling.LANCZOS)
          dst=Path('android-youtube-test/app/src/main/res/drawable-nodpi/ic_launcher.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          src.save(dst,format='PNG',optimize=True)
          print('Launcher written:',src.size,src.mode,dst.stat().st_size,'bytes')
          PY

      - name: Validate launcher PNG before build
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, hashlib
          from PIL import Image
          p=Path('android-youtube-test/app/src/main/res/drawable-nodpi/ic_launcher.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'Launcher icon is not a valid PNG'
          assert b[12:16] == b'IHDR', 'PNG missing IHDR'
          w,h=struct.unpack('>II',b[16:24])
          assert (w,h)==(512,512), f'Unexpected launcher dimensions: {w}x{h}'
          Image.open(p).verify()
          print('Launcher PNG OK:',w,h,len(b),'bytes SHA256',hashlib.sha256(b).hexdigest())
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-youtube-test
        run: gradle clean assembleDebug

      - name: Verify icon packaged and signing certificate
        run: |
          set -e
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'res/.*/ic_launcher.*png'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED='716c1a8a139ad956ef8a00f85f153eb0028d109c75b1b938bdf3bb3eb23c22b5'
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/apksigner.txt | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test "$ACTUAL" = "$EXPECTED"
          echo "Signing certificate SHA-256 OK: $ACTUAL"

      - name: Verify packaged HTML contains v142 native tap logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('android-youtube-test/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              html=z.read('assets/geovision.html').decode('utf-8')
          forbidden=['Mettetevi comodi','Iniziamo questo viaggio','Siamo a ${p.name}','speak(told);']
          found=[x for x in forbidden if x in html]
          if found:
              raise SystemExit('Packaged APK still contains intro strings: '+repr(found))
          required=[
              'function gvAutoOpenNativeGooglePhotoV142(p)',
              'window.GeoVisionNativeUI.tapAtCss(x,y,window.devicePixelRatio||1)',
              'void enrichNarration(p); await cardPromise; void gvAutoOpenNativeGooglePhotoV142(p);'
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Packaged APK missing v142 native tap logic: '+repr(missing))
          print('Packaged APK v142 native tap logic present: OK')
          print('Packaged APK narration intro absent: OK')
          PY

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v142_NATIVE_GOOGLE_PHOTO_TAP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v142_NATIVE_GOOGLE_PHOTO_TAP
          path: GeoVision_v142_NATIVE_GOOGLE_PHOTO_TAP.apk
          if-no-files-found: error
