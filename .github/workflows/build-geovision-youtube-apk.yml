name: Build GeoVision v135 Verified Binary Icon APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - name: Prepare GeoVision recovery HTML
        run: python android-youtube-test/prepare_v118.py

      - name: Validate generated GeoVision JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("android-youtube-test/app/src/main/assets/geovision.html")
          s=p.read_text(encoding="utf-8")
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path("/tmp/geovision-check.js").write_text("\n".join(blocks),encoding="utf-8")
          print("HTML bytes:",p.stat().st_size,"script blocks:",len(blocks))
          PY
          node --check /tmp/geovision-check.js

      - name: Validate committed launcher PNG byte-for-byte
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib
          p=Path('android-youtube-test/app/src/main/res/drawable-nodpi/ic_launcher.png')
          b=p.read_bytes()
          expected='c1025efdcb809b84586b6fd4bc33419069b9d408fcf870d2648ff2cbbac4b33e'
          got=hashlib.sha256(b).hexdigest()
          assert got == expected, f'SHA256 mismatch: {got}'
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'Launcher icon is not a valid PNG'
          assert b[12:16] == b'IHDR', 'PNG missing IHDR'
          w,h=struct.unpack('>II',b[16:24])
          assert (w,h)==(96,96), f'Unexpected dimensions: {w}x{h}'
          pos=8
          while pos < len(b):
              ln=struct.unpack('>I',b[pos:pos+4])[0]
              typ=b[pos+4:pos+8]
              dat=b[pos+8:pos+8+ln]
              crc_read=struct.unpack('>I',b[pos+8+ln:pos+12+ln])[0]
              crc_calc=zlib.crc32(typ)
              crc_calc=zlib.crc32(dat,crc_calc) & 0xffffffff
              assert crc_read == crc_calc, f'Bad CRC in {typ!r}'
              pos += 12 + ln
              if typ == b'IEND': break
          assert pos == len(b), 'Trailing or missing PNG data'
          print('Launcher PNG VERIFIED:',w,h,len(b),'bytes SHA256',got)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-youtube-test
        run: gradle clean assembleDebug

      - name: Verify packaged icon and signing certificate
        run: |
          set -e
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'res/.*/ic_launcher.*png'
          mkdir -p /tmp/apkcheck
          cd /tmp/apkcheck
          unzip -p "$GITHUB_WORKSPACE/$APK" res/drawable-nodpi-v4/ic_launcher.png > ic_launcher.png || unzip -p "$GITHUB_WORKSPACE/$APK" res/drawable-nodpi/ic_launcher.png > ic_launcher.png
          test -s ic_launcher.png
          sha256sum ic_launcher.png
          test "$(sha256sum ic_launcher.png | awk '{print $1}')" = "c1025efdcb809b84586b6fd4bc33419069b9d408fcf870d2648ff2cbbac4b33e"
          cd "$GITHUB_WORKSPACE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi '71:6C:1A:8A:13:9A:D9:56:EF:8A:00:F8:5F:15:3E:B0:02:8D:10:9C:75:B1:B9:38:BD:F3:BB:3E:B2:3C:22:B5' /tmp/apksigner.txt

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v135_VERIFIED_BINARY_ICON.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v135_VERIFIED_BINARY_ICON
          path: GeoVision_v135_VERIFIED_BINARY_ICON.apk
          if-no-files-found: error
