name: Build GeoVision v132 Verified PNG Launcher Icon APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - name: Prepare GeoVision recovery HTML
        run: python android-youtube-test/prepare_v118.py

      - name: Validate generated GeoVision JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("android-youtube-test/app/src/main/assets/geovision.html")
          s=p.read_text(encoding="utf-8")
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path("/tmp/geovision-check.js").write_text("\n".join(blocks),encoding="utf-8")
          print("HTML bytes:",p.stat().st_size,"script blocks:",len(blocks))
          PY
          node --check /tmp/geovision-check.js

      - name: Validate launcher icon sources
        run: |
          set -e
          file android-youtube-test/app/src/main/res/mipmap-*/ic_launcher.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths=sorted(Path('android-youtube-test/app/src/main/res').glob('mipmap-*/ic_launcher.png'))
          assert paths, 'No PNG launcher icons found'
          expected={
            'mipmap-mdpi':48,
            'mipmap-hdpi':72,
            'mipmap-xhdpi':96,
            'mipmap-xxhdpi':144,
            'mipmap-xxxhdpi':192,
          }
          for p in paths:
            im=Image.open(p)
            im.verify()
            im=Image.open(p)
            side=expected.get(p.parent.name)
            if side:
              assert im.size==(side,side), f'{p}: expected {(side,side)}, got {im.size}'
            print(p, im.size, im.mode)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-youtube-test
        run: gradle clean assembleDebug

      - name: Verify packaged launcher icons and signing
        run: |
          set -e
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'res/mipmap.*ic_launcher.*png'
          apksigner verify --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi '71:6C:1A:8A:13:9A:D9:56:EF:8A:00:F8:5F:15:3E:B0:02:8D:10:9C:75:B1:B9:38:BD:F3:BB:3E:B2:3C:22:B5' /tmp/apksigner.txt

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v132_VERIFIED_PNG_ICON.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v132_VERIFIED_PNG_ICON
          path: GeoVision_v132_VERIFIED_PNG_ICON.apk
          if-no-files-found: error
