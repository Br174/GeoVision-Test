name: Build GeoVision v122 Stable Update APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GeoVision Android HTML
        run: python android-youtube-test/prepare_v118.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable GeoVision debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: geovision-android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android-youtube-test
        run: gradle assembleDebug

      - name: Verify signing certificate
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA256:|Alias name:" || true

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v122_STABLE_UPDATE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v122_STABLE_UPDATE
          path: GeoVision_v122_STABLE_UPDATE.apk
          if-no-files-found: error
