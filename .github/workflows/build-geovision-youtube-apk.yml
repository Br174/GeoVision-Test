name: Build GeoVision v154 Locality Photo Resolver LAB APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - name: Prepare GeoVision recovery HTML
        run: python android-youtube-test/prepare_v118.py

      - name: Apply v136 exploration visibility patch
        run: python android-youtube-test/patch_v136_exploration_visibility.py

      - name: Apply v137 remove artificial narration intro
        run: python android-youtube-test/patch_v137_remove_intro.py

      - name: Apply v139 automatic Google photo lightbox
        run: python android-youtube-test/patch_v139_auto_google_photo.py

      - name: Apply v140 robust fullscreen photo viewer
        run: python android-youtube-test/patch_v140_fullscreen_photo_viewer.py

      - name: Apply v141 photo wait and retry
        run: python android-youtube-test/patch_v141_photo_wait_retry.py

      - name: Apply v142 native Android Google photo tap
        run: python android-youtube-test/patch_v142_native_google_photo_tap.py

      - name: Apply v143 direct card intercept native tap
        run: python android-youtube-test/patch_v143_card_intercept_native_tap.py

      - name: Apply v144 existing Google photo folder fullscreen
        run: python android-youtube-test/patch_v144_official_media_fullscreen.py

      - name: Apply v145 single-place/locality photo routing
        run: python android-youtube-test/patch_v145_flatten_photo_groups.py

      - name: Apply v147 territory result photo selection
        run: python android-youtube-test/patch_v147_territory_result_photos.py

      - name: Apply v148 Maps intent guard
        run: python android-youtube-test/patch_v148_block_maps_intent.py

      - name: Apply v149 selected territory official media
        run: python android-youtube-test/patch_v149_selected_place_official_media.py

      - name: Apply v154 locality photo resolver LAB
        run: python android-youtube-test/patch_v154_locality_photo_resolver.py

      - name: Assert v154 isolated photo resolver chain
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          java=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text(encoding='utf-8')
          gradle=Path('android-youtube-test/app/build.gradle').read_text(encoding='utf-8')
          required=[
              'async function gvV147OpenTerritorySelectedPlace(place)',
              'GeoVision v149 selected territory -> official Place media',
              'function gvV154IsTerritorialPhotoPlace(p)',
              'async function gvV154LocalityPhotos(p)',
              'gvV154SearchTerritoryCandidates',
              'void gvV154LocalityPhotos(p).then(urls => {',
              'window.gvV154LastPhotoDiag',
              'frazione|rione|contrada|quartiere|borgo|localit',
              'private boolean gvV148HandleSpecialUrl(WebView view, String url)'
          ]
          missing=[x for x in required if x not in html and x not in java]
          if missing:
              raise SystemExit('v154 logic missing: '+repr(missing))
          forbidden=[
              'gv-v150-stage',
              'gvV151NewPlaceItems',
              'gvV151OfficialRenderedItems',
              'gvV152AutoOpenOfficialMedia',
              'V152: apro la prima foto',
              'Mettetevi comodi',
              'Iniziamo questo viaggio',
              'speak(told);'
          ]
          found=[x for x in forbidden if x in html]
          if found:
              raise SystemExit('v154 contains excluded experimental or old intro logic: '+repr(found))
          if html.count('function gvV154IsTerritorialPhotoPlace(p)') != 1:
              raise SystemExit('v154 territorial predicate duplicated')
          if html.count('async function gvV154LocalityPhotos(p)') != 1:
              raise SystemExit('v154 photo resolver duplicated')
          if 'function isOfficialCityLocality(p)' not in html:
              raise SystemExit('original geographic classifier was altered/removed')
          if 'versionCode 154' not in gradle or "versionName '1.54-locality-photo-resolver-lab'" not in gradle:
              raise SystemExit('Android version is not v154 LAB')
          print('v154 resolver present: OK')
          print('v153/v149 stable chain retained: OK')
          print('original geographic classifier retained: OK')
          print('v150/v151/v152 experimental runtime excluded: OK')
          print('v154 static regression checks: 10/10 OK')
          PY

      - name: Validate generated GeoVision JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-youtube-test/app/src/main/assets/geovision.html')
          s=p.read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/geovision-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('HTML bytes:',p.stat().st_size,'script blocks:',len(blocks))
          PY
          node --check /tmp/geovision-check.js

      - name: Rebuild launcher icon from repository Base64
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,re,io
          raw=Path('android-youtube-test/icon/geovision_icon.png.b64').read_text(encoding='utf-8-sig',errors='ignore')
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',raw))
          decoded=None
          for trim in range(4):
              candidate=clean[:-trim] if trim else clean
              candidate=candidate.rstrip('=')+'='*((4-len(candidate.rstrip('='))%4)%4)
              try:
                  data=base64.b64decode(candidate,validate=True)
                  Image.open(io.BytesIO(data)).verify()
                  decoded=data
                  break
              except Exception:
                  pass
          if decoded is None:
              raise SystemExit('Repository Base64 icon is corrupted')
          src=Image.open(io.BytesIO(decoded)).convert('RGBA')
          if src.size!=(512,512):
              src=src.resize((512,512),Image.Resampling.LANCZOS)
          dst=Path('android-youtube-test/app/src/main/res/drawable-nodpi/ic_launcher.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          src.save(dst,format='PNG',optimize=True)
          print('Launcher written:',src.size,src.mode,dst.stat().st_size,'bytes')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-youtube-test
        run: gradle clean assembleDebug

      - name: Verify signing certificate and packaged v154 resolver
        run: |
          set -e
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED='716c1a8a139ad956ef8a00f85f153eb0028d109c75b1b938bdf3bb3eb23c22b5'
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/apksigner.txt | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
          test "$ACTUAL" = "$EXPECTED"
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('android-youtube-test/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              html=z.read('assets/geovision.html').decode('utf-8')
          assert 'GeoVision v149 selected territory -> official Place media' in html
          assert 'async function gvV154LocalityPhotos(p)' in html
          assert 'void gvV154LocalityPhotos(p).then(urls => {' in html
          assert 'gvV151NewPlaceItems' not in html
          assert 'gvV152AutoOpenOfficialMedia' not in html
          print('Packaged APK v154 photo resolver: OK')
          PY

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v154_LOCALITY_PHOTO_RESOLVER_LAB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v154_LOCALITY_PHOTO_RESOLVER_LAB
          path: GeoVision_v154_LOCALITY_PHOTO_RESOLVER_LAB.apk
          if-no-files-found: error
