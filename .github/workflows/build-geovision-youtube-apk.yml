name: Build GeoVision v125 Stable Signing APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GeoVision Android HTML
        run: python android-youtube-test/prepare_v118.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install stable GeoVision test signing key
        run: |
          mkdir -p ~/.android
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Build debug APK
        working-directory: android-youtube-test
        run: gradle assembleDebug

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs android-youtube-test/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_v125_STABLE_SIGNING_BASE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_v125_STABLE_SIGNING_BASE
          path: GeoVision_v125_STABLE_SIGNING_BASE.apk
          if-no-files-found: error
