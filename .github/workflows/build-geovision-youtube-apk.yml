name: Build GeoVision Candidate 001 Core Keys APK

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          mkdir -p android-youtube-test/signing
          git fetch origin main --depth=1
          git show origin/main:android-youtube-test/signing/geovision-debug-stable.keystore.b64 | base64 -d > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - name: Prepare historical v118 runtime
        run: python android-youtube-test/prepare_v118.py

      - name: Apply isolated key counter patch
        run: python android-youtube-test/patch_candidate_key_counts.py

      - name: Validate generated runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-youtube-test/app/src/main/assets/geovision.html')
          s=p.read_text(encoding='utf-8')
          required=[
            'mapsSwitchCount1','mapsSwitchCount2','mapsSwitchCount3','mapsSwitchTotal',
            'gvRecordGoogleAutoSwitch(previous)',
            "reason!=='manuale'",
            'geovision_google_switch_stats_daily'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing candidate markers: '+', '.join(missing))
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/geovision-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('HTML bytes:',p.stat().st_size,'script blocks:',len(blocks))
          PY
          node --check /tmp/geovision-check.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-youtube-test
        run: gradle clean assembleDebug

      - name: Verify stable signing certificate
        run: |
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$APK" > /tmp/cert.txt
          cat /tmp/cert.txt
          grep -q 'SHA256: 71:6C:1A:8A:13:9A:D9:56:EF:8A:00:F8:5F:15:3E:B0:02:8D:10:9C:75:B1:B9:38:BD:F3:BB:3E:B2:3C:22:B5' /tmp/cert.txt

      - name: Rename APK
        run: cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk GeoVision_CANDIDATE_001_CORE_KEYS_v154.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_CANDIDATE_001_CORE_KEYS_v154
          path: GeoVision_CANDIDATE_001_CORE_KEYS_v154.apk
          if-no-files-found: error
