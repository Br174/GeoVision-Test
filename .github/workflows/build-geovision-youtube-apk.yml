name: Build GeoVision Android Storage Isolation Proof

on:
  push:
    paths:
      - 'android-youtube-test/**'
      - '.github/workflows/build-geovision-youtube-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare stable signing keystore
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build four controlled probe APKs
        run: |
          set -euo pipefail
          cp android-youtube-test/app/build.gradle /tmp/gv-build.gradle
          cp android-youtube-test/app/src/main/AndroidManifest.xml /tmp/gv-manifest.xml

          build_variant() {
            MODE="$1"
            APPID="$2"
            LABEL="$3"
            VCODE="$4"
            OUT="$5"

            cp /tmp/gv-build.gradle android-youtube-test/app/build.gradle
            cp /tmp/gv-manifest.xml android-youtube-test/app/src/main/AndroidManifest.xml

            python android-youtube-test/prepare_v118.py
            python android-youtube-test/patch_v136_exploration_visibility.py
            python android-youtube-test/patch_v137_remove_intro.py
            GV_PROBE_MODE="$MODE" python android-youtube-test/patch_storage_isolation_probe.py

            APPID="$APPID" LABEL="$LABEL" VCODE="$VCODE" MODE="$MODE" python - <<'PY'
          from pathlib import Path
          import os,re
          gradle=Path('android-youtube-test/app/build.gradle')
          s=gradle.read_text(encoding='utf-8')
          s=re.sub(r"applicationId '[^']+'", "applicationId '"+os.environ['APPID']+"'", s, count=1)
          s=re.sub(r'versionCode\s+\d+', 'versionCode '+os.environ['VCODE'], s, count=1)
          s=re.sub(r"versionName '[^']+'", "versionName 'storage-proof-"+os.environ['MODE'].lower()+"'", s, count=1)
          gradle.write_text(s,encoding='utf-8')
          manifest=Path('android-youtube-test/app/src/main/AndroidManifest.xml')
          m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'android:label="[^"]+"', 'android:label="'+os.environ['LABEL']+'"', m, count=1)
          manifest.write_text(m,encoding='utf-8')
          PY

            python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-youtube-test/app/src/main/assets/geovision.html')
          s=p.read_text(encoding='utf-8')
          assert 'GV_STORAGE_ISOLATION_PROBE_20260910' in s
          blocks=re.findall(r'<script(?:\s+type="module")?[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/geovision-check.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('Probe HTML bytes:',p.stat().st_size,'script blocks:',len(blocks))
          PY
            node --check /tmp/geovision-check.js

            (cd android-youtube-test && gradle clean assembleDebug)
            cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk "$OUT"

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs "$OUT" | tee "/tmp/${MODE}-cert.txt"
            EXPECTED='716c1a8a139ad956ef8a00f85f153eb0028d109c75b1b938bdf3bb3eb23c22b5'
            ACTUAL=$(grep -i 'certificate SHA-256 digest:' "/tmp/${MODE}-cert.txt" | head -1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            test "$ACTUAL" = "$EXPECTED"

            unzip -p "$OUT" assets/geovision.html | grep -q 'GV_STORAGE_ISOLATION_PROBE_20260910'
            echo "Built $OUT · mode=$MODE · appId=$APPID · versionCode=$VCODE · signer OK"
          }

          build_variant A   it.geovision.storageproof.same     'GV TEST SAME A' 2101 GeoVision_STORAGE_TEST_A_CLEAN.apk
          build_variant B   it.geovision.storageproof.same     'GV TEST SAME B' 2102 GeoVision_STORAGE_TEST_B_CONTAMINA.apk
          build_variant C   it.geovision.storageproof.same     'GV TEST SAME C' 2103 GeoVision_STORAGE_TEST_C_VERIFICA.apk
          build_variant ISO it.geovision.storageproof.isolated 'GV TEST ISOLATO' 2101 GeoVision_STORAGE_TEST_ISOLATO.apk

      - name: Package test kit
        run: |
          cat > ISTRUZIONI_TEST_ISOLAMENTO.txt <<'TXT'
          TEST CONTROLLO PERSISTENZA DATI ANDROID / WEBVIEW

          IMPORTANTE: la normale GeoVision v138 non viene toccata: questi APK usano package di test separati.

          ORDINE TEST STESSA FAMIGLIA:
          1) Installa GeoVision_STORAGE_TEST_A_CLEAN.apk e aprila. Deve mostrare AMBIENTE PULITO.
          2) Senza disinstallare A, installa GeoVision_STORAGE_TEST_B_CONTAMINA.apk. E' un aggiornamento dello stesso package. Aprila: scrive CONTAMINATO_DA_B.
          3) Senza cancellare dati/disinstallare, installa GeoVision_STORAGE_TEST_C_VERIFICA.apk. E' un altro aggiornamento dello stesso package. Se mostra STATO EREDITATO: CONTAMINATO_DA_B, la persistenza tra versioni dello stesso package e' dimostrata.

          TEST ISOLATO:
          4) Installa GeoVision_STORAGE_TEST_ISOLATO.apk. Ha package diverso. Deve mostrare AMBIENTE PULITO anche se B/C hanno contaminato l'altra famiglia.

          Per ripetere il test da zero, disinstalla le app GV TEST SAME e GV TEST ISOLATO prima di ricominciare.
          TXT

          zip -j GeoVision_STORAGE_TEST_A_CLEAN.zip GeoVision_STORAGE_TEST_A_CLEAN.apk
          zip -j GeoVision_STORAGE_TEST_B_CONTAMINA.zip GeoVision_STORAGE_TEST_B_CONTAMINA.apk
          zip -j GeoVision_STORAGE_TEST_C_VERIFICA.zip GeoVision_STORAGE_TEST_C_VERIFICA.apk
          zip -j GeoVision_STORAGE_TEST_ISOLATO.zip GeoVision_STORAGE_TEST_ISOLATO.apk
          zip -j GeoVision_STORAGE_ISOLATION_TEST_KIT.zip \
            GeoVision_STORAGE_TEST_A_CLEAN.apk \
            GeoVision_STORAGE_TEST_B_CONTAMINA.apk \
            GeoVision_STORAGE_TEST_C_VERIFICA.apk \
            GeoVision_STORAGE_TEST_ISOLATO.apk \
            ISTRUZIONI_TEST_ISOLAMENTO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_STORAGE_ISOLATION_TEST_KIT
          path: |
            GeoVision_STORAGE_TEST_A_CLEAN.apk
            GeoVision_STORAGE_TEST_B_CONTAMINA.apk
            GeoVision_STORAGE_TEST_C_VERIFICA.apk
            GeoVision_STORAGE_TEST_ISOLATO.apk
            GeoVision_STORAGE_TEST_A_CLEAN.zip
            GeoVision_STORAGE_TEST_B_CONTAMINA.zip
            GeoVision_STORAGE_TEST_C_VERIFICA.zip
            GeoVision_STORAGE_TEST_ISOLATO.zip
            GeoVision_STORAGE_ISOLATION_TEST_KIT.zip
            ISTRUZIONI_TEST_ISOLAMENTO.txt
          if-no-files-found: error
