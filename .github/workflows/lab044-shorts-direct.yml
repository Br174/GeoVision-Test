name: LAB 044 SHORTS DIRECT
'on':
  push:
    branches: ['lab/shorts-direct-044']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB044 from proven LAB043 source chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.shortsdirect044/; s/versionCode 2012/versionCode 2044/; s/1.0-failover-012/1.0-shorts-direct-044/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 044 SHORTS DIRECT/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()
          m=Path('android-youtube-test/app/src/main/AndroidManifest.xml').read_text()
          checks=[
            h.count('function launchPlatform(p) {')==1,
            h.count('data-p="shorts"')==1,
            h.count('<button data-vp="shorts">')==1,
            h.count("if(p === 'shorts')")==1,
            'sp=EgIQCQ%253D%253D' in h,
            h.count('function gv043PlatformQuery()')==1,
            'package=com.google.android.youtube;end' in h,
            'gvFacebookLegacySearch' in h,
            'instagram' in h.lower(),
            'tiktok' in h.lower(),
            'if (gv043Intro) speak(gv043Intro)' in h,
            "aiNarration(p, 'guide', '', told)" in h,
            'private void returnToGeoVision()' in j,
            'private void hideReturnBubble()' in j,
            "applicationId 'it.geovision.lab.shortsdirect044'" in g,
            'versionCode 2044' in g,
            'LAB 044 SHORTS DIRECT' in m,
          ]
          assert all(checks),[i for i,x in enumerate(checks,1) if not x]
          print('LAB044 pre-build regression checks OK:',len(checks))
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          python - <<'PY'
          import zipfile,os
          apk='android-youtube-test/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ['AndroidManifest.xml','classes.dex','resources.arsc','assets/geovision.html']: assert req in names
              h=z.read('assets/geovision.html').decode('utf-8')
              assert 'data-p="shorts"' in h and '<button data-vp="shorts">' in h
              assert 'sp=EgIQCQ%253D%253D' in h
          print('LAB044 APK integrity OK',os.path.getsize(apk))
          PY
          mkdir -p out44
          cp "$APK" out44/GeoVision_LAB044_SHORTS_DIRECT.apk
          cp out/LAB_012_FAILOVER.html out44/GeoVision_LAB044_SHORTS_DIRECT.html
          cd out44
          zip GeoVision_LAB044_APK.zip GeoVision_LAB044_SHORTS_DIRECT.apk
          zip GeoVision_LAB044_PACKAGE.zip GeoVision_LAB044_SHORTS_DIRECT.apk GeoVision_LAB044_SHORTS_DIRECT.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-044-SHORTS-DIRECT
          path: |
            out44/GeoVision_LAB044_SHORTS_DIRECT.apk
            out44/GeoVision_LAB044_APK.zip
            out44/GeoVision_LAB044_PACKAGE.zip
          if-no-files-found: error
