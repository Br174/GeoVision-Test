name: Verify KEYBOX 008 and LAB 011 Failover
on:
  push:
    branches: ['work/keybox008-lab011-failover']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, unit, static and lint tests
        run: bash monitor010/build.sh
      - name: Browser integration - manual switches and transparent failover
        run: |
          npm install --no-save playwright@1.51.1 leaflet@1.9.4
          npx playwright install --with-deps chromium
          node monitor010/tests/browser.cjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 vault, permission and bridge regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p android-keybox connectedDebugAndroidTest
            adb install -r android-keybox/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n it.geovision.keybox/.MainActivity
            gradle -p android-youtube-test connectedDebugAndroidTest || { adb logcat -d -s GeoVisionKeySync System.out ActivityManager AndroidRuntime; exit 1; }
            adb shell am start -n it.geovision.keybox/.MainActivity
            sleep 2
            adb exec-out screencap -p > out/Monitor_KEYBOX_008.png
      - name: Package verified deliverables
        run: |
          cp monitor010/REPORT_011.md out/REPORT.md
          cd out
          zip KEYBOX_008_MONITOR.zip KEYBOX_008_MONITOR.apk Monitor_KEYBOX_008.png REPORT.md
          zip LAB_011_FAILOVER.zip LAB_011_FAILOVER.apk LAB_011_FAILOVER.html Monitor_API_LAB_011.png REPORT.md
          sha256sum *.apk *.html *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision-KEYBOX008-LAB011-verified
          path: |
            out/KEYBOX_008_MONITOR.apk
            out/KEYBOX_008_MONITOR.zip
            out/LAB_011_FAILOVER.apk
            out/LAB_011_FAILOVER.html
            out/LAB_011_FAILOVER.zip
            out/Monitor_API_LAB_011.png
            out/Monitor_KEYBOX_008.png
            out/REPORT.md
            out/SHA256SUMS.txt
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover011-verification-reports
          path: |
            out/Monitor*.png
            android-keybox/app/build/reports/
            android-youtube-test/app/build/reports/
