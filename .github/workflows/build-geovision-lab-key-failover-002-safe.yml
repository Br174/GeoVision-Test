name: Build GeoVision LAB KEY FAILOVER 002 SAFE

on:
  push:
    branches:
      - lab/google-key-failover-001
    paths:
      - 'android-youtube-test/madre001/build_lab_google_key_failover_002_safe.sh'
      - 'android-youtube-test/madre001/patch_google_key_failover_safe.py'
      - '.github/workflows/build-geovision-lab-key-failover-002-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build safe isolated Google key failover LAB 002
        run: bash android-youtube-test/madre001/build_lab_google_key_failover_002_safe.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_KEY_FAILOVER_002_SAFE
          path: |
            GeoVision_LAB_KEY_FAILOVER_002_SAFE.apk
            GeoVision_LAB_KEY_FAILOVER_002_SAFE.html
            GeoVision_LAB_KEY_FAILOVER_002_SAFE.zip
            MANIFEST_LAB_KEY_FAILOVER_002_SAFE.txt
          if-no-files-found: error
