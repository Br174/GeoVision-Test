name: LAB 016 TTS SWIPE SAFE
on:
  push:
    branches: ['lab/tts-swipe-safe-016']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build clean LAB013 plus isolated TTS/swipe
        run: |
          python monitor010/prepare.py
          python monitor010/patch_tts_swipe_safe_016.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.ttsswipesafe016/; s/versionCode 2012/versionCode 2016/; s/1.0-failover-012/1.0-tts-swipe-safe-016/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 016 TTS SWIPE SAFE/' android-youtube-test/app/src/main/AndroidManifest.xml
          gradle -p android-youtube-test assembleDebug
          mkdir -p out16
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out16/LAB_016_TTS_SWIPE_SAFE.apk
          cp out/LAB_012_FAILOVER.html out16/LAB_016_TTS_SWIPE_SAFE.html
          cd out16 && zip LAB_016_TTS_SWIPE_SAFE.zip LAB_016_TTS_SWIPE_SAFE.apk LAB_016_TTS_SWIPE_SAFE.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-016-TTS-SWIPE-SAFE
          path: out16/LAB_016_TTS_SWIPE_SAFE.zip
