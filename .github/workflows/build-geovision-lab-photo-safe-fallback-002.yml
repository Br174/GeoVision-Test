name: Build GeoVision LAB FOTO SAFE 002

on:
  push:
    branches:
      - lab/photo-safe-fallback-002
    paths:
      - 'android-youtube-test/madre001/build_lab_photo_safe_fallback_002.sh'
      - 'android-youtube-test/madre001/patch_photo_safe_fallback_002.py'
      - '.github/workflows/build-geovision-lab-photo-safe-fallback-002.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build regression-safe photo LAB
        run: bash android-youtube-test/madre001/build_lab_photo_safe_fallback_002.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_LAB_FOTO_SAFE_002
          path: |
            GeoVision_LAB_FOTO_SAFE_002.apk
            GeoVision_LAB_FOTO_SAFE_002.html
            GeoVision_LAB_FOTO_SAFE_002.zip
            MANIFEST_LAB_FOTO_SAFE_002.txt
          if-no-files-found: error
