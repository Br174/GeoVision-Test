name: Build KEYBOX 002 SYNC

on:
  push:
    branches:
      - keybox/002-sync
    paths:
      - 'android-youtube-test/madre001/build_keybox_002_sync.sh'
      - '.github/workflows/build-geovision-keybox-002-sync.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build KEYBOX 002 SYNC
        run: bash android-youtube-test/madre001/build_keybox_002_sync.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision_KEYBOX_002_SYNC
          path: |
            GeoVision_KEYBOX_002_SYNC.apk
            GeoVision_KEYBOX_002_SYNC.zip
            README_KEYBOX_002_SYNC.txt
          if-no-files-found: error
