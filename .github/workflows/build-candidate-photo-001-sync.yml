name: Build CAND 001 FOTO SYNC

on:
  push:
    branches:
      - sync/candidate-photo-001
    paths:
      - 'android-youtube-test/madre001/build_candidate_photo_001_sync.sh'
      - 'android-youtube-test/madre001/patch_key_sync_006.py'
      - 'android-youtube-test/madre001/patch_android_key_sync_006.py'
      - '.github/workflows/build-candidate-photo-001-sync.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build CAND 001 FOTO SYNC
        run: bash android-youtube-test/madre001/build_candidate_photo_001_sync.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CAND_001_FOTO_SYNC
          path: |
            CAND_001_FOTO_SYNC.apk
            CAND_001_FOTO_SYNC.html
            CAND_001_FOTO_SYNC.zip
            MANIFEST_CAND_001_FOTO_SYNC.txt
          if-no-files-found: error
