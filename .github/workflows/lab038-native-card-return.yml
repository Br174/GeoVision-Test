name: LAB 038 NATIVE CARD RETURN
on:
  push:
    branches: ['lab/native-card-return-038']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB038
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_native_card_return_038.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.nativecardreturn038/; s/versionCode 2012/versionCode 2038/; s/1.0-failover-012/1.0-native-card-return-038/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 038 NATIVE CARD RETURN/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          assert 'PendingIntent.getActivity' in j
          assert 'GV_RETURN_CARD_ACTION' in j
          assert 'onWindowFocusChanged(boolean hasFocus)' in j
          assert 'gv038RestoreGoogleCardAfterReturn' in j
          assert 'private void hideReturnBubble(){' in j
          assert 'hideReturnBubble();\n        Intent back=getPackageManager()' not in j
          assert 'task.moveToFront()' not in j and 'ActivityManager.AppTask' not in j
          assert 'FLAG_ACTIVITY_CLEAR_TOP' not in j
          assert 'function gv038RememberGoogleCardState()' in h
          assert 'function gv038RestoreGoogleCardState()' in h
          assert 'function closeSheet() { gv038ClearRememberedGoogleCard();' in h
          assert "if(p === 'youtube') gv029ShowReturnBubble();" in h
          print('LAB038 native card return checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out38
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out38/LAB_038_NATIVE_CARD_RETURN.apk
          cp out/LAB_012_FAILOVER.html out38/LAB_038_NATIVE_CARD_RETURN.html
          cd out38 && zip LAB_038_NATIVE_CARD_RETURN_PACKAGE.zip LAB_038_NATIVE_CARD_RETURN.apk LAB_038_NATIVE_CARD_RETURN.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-038-NATIVE-CARD-RETURN
          path: out38/LAB_038_NATIVE_CARD_RETURN_PACKAGE.zip
          if-no-files-found: error
