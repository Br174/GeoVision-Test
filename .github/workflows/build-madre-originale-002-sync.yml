name: Build MADRE ORIGINALE 2 SYNC

on:
  push:
    branches:
      - sync/madre-originale-002
    paths:
      - 'android-youtube-test/madre001/build_madre_originale_002_sync.sh'
      - 'android-youtube-test/madre001/patch_key_sync_006.py'
      - 'android-youtube-test/madre001/patch_android_key_sync_006.py'
      - '.github/workflows/build-madre-originale-002-sync.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build MADRE ORIGINALE 2 SYNC
        run: bash android-youtube-test/madre001/build_madre_originale_002_sync.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MADRE_ORIGINALE_2_SYNC
          path: |
            MADRE_ORIGINALE_2_SYNC.apk
            MADRE_ORIGINALE_2_SYNC.html
            MADRE_ORIGINALE_2_SYNC.zip
            MANIFEST_MADRE_ORIGINALE_2_SYNC.txt
          if-no-files-found: error
