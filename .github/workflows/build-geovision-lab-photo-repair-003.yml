name: Build LAB 003 FOTO

on:
  push:
    branches:
      - lab/photo-repair-003
    paths:
      - 'android-youtube-test/madre001/build_lab_photo_repair_003.sh'
      - 'android-youtube-test/madre001/patch_photo_repair_003.py'
      - '.github/workflows/build-geovision-lab-photo-repair-003.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build LAB 003 photo repair
        run: bash android-youtube-test/madre001/build_lab_photo_repair_003.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LAB_003_FOTO
          path: |
            LAB_003_FOTO.apk
            LAB_003_FOTO.html
            LAB_003_FOTO.zip
            MANIFEST_LAB_003_FOTO.txt
          if-no-files-found: error
