name: LAB 026 GALLERIA FOTO
on:
  push:
    branches: ['lab/photo-gallery-026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - name: Build LAB026
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_photo_gallery_026.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.photogallery026/; s/versionCode 2012/versionCode 2026/; s/1.0-failover-012/1.0-photo-gallery-026/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 026 GALLERIA FOTO/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          s=Path('android-youtube-test/app/src/main/assets/geovision.html').read_text(encoding='utf-8')
          assert 'renderOfficialGoogleCard(p)' in s
          assert 'gv026-gallery-style' in s
          assert "if(typeof openPhotoGallery==='function') openPhotoGallery();" in s
          print('LAB026 static checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out26
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out26/LAB_026_GALLERIA_FOTO.apk
          cp out/LAB_012_FAILOVER.html out26/LAB_026_GALLERIA_FOTO.html
          cd out26 && zip LAB_026_GALLERIA_FOTO_PACKAGE.zip LAB_026_GALLERIA_FOTO.apk LAB_026_GALLERIA_FOTO.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-026-GALLERIA-FOTO
          path: out26/LAB_026_GALLERIA_FOTO_PACKAGE.zip
          if-no-files-found: error
