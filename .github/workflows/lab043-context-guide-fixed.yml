name: LAB 043 CONTEXT GUIDE FIXED
# rebuild 61e02b
on:
  push:
    branches: ['lab/context-guide-043-fixed']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB043 from proven LAB042 source chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.contextguide043/; s/versionCode 2012/versionCode 2043/; s/1.0-failover-012/1.0-context-guide-043/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 043 CONTEXT GUIDE/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()
          m=Path('android-youtube-test/app/src/main/AndroidManifest.xml').read_text()
          checks=[
            h.count('function launchPlatform(p) {')==1,
            h.count('function gv043SearchPair()')==1,
            'package=com.google.android.youtube;end' in h,
            'gvFacebookLegacySearch' in h,
            'instagram' in h.lower(),
            'tiktok' in h.lower(),
            'if(gv043Intro) speak(gv043Intro)' in h,
            'instantNarrationIntro(p)' in h,
            'private void returnToGeoVision()' in j,
            'private void hideReturnBubble()' in j,
            "applicationId 'it.geovision.lab.contextguide043'" in g,
            'versionCode 2043' in g,
            'LAB 043 CONTEXT GUIDE' in m,
          ]
          assert all(checks),[i for i,x in enumerate(checks,1) if not x]
          print('LAB043 pre-build regression checks OK:',len(checks))
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          python - <<'PY'
          import zipfile,os
          apk='android-youtube-test/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for req in ['AndroidManifest.xml','classes.dex','resources.arsc','assets/geovision.html']: assert req in names
          print('APK integrity OK',os.path.getsize(apk))
          PY
          mkdir -p out43
          cp "$APK" out43/GeoVision_LAB043_CONTEXT_GUIDE_FIXED.apk
          cp out/LAB_012_FAILOVER.html out43/GeoVision_LAB043_CONTEXT_GUIDE_FIXED.html
          cd out43
          zip GeoVision_LAB043_APK.zip GeoVision_LAB043_CONTEXT_GUIDE_FIXED.apk
          zip GeoVision_LAB043_PACKAGE.zip GeoVision_LAB043_CONTEXT_GUIDE_FIXED.apk GeoVision_LAB043_CONTEXT_GUIDE_FIXED.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-043-CONTEXT-GUIDE-FIXED
          path: |
            out43/GeoVision_LAB043_CONTEXT_GUIDE_FIXED.apk
            out43/GeoVision_LAB043_APK.zip
            out43/GeoVision_LAB043_PACKAGE.zip
          if-no-files-found: error
