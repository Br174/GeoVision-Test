name: LAB 046 CONTEXT CLEAN
'on':
  push:
    branches: ['lab/context-clean-046']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB046 from LAB045 chain
        run: |
          set -euo pipefail
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_youtube_return_tap_037.py
          python monitor010/patch_youtube_native_intent_042.py
          python monitor010/patch_context_guide_043.py
          python monitor010/patch_shorts_direct_044.py
          python monitor010/patch_search_audio_045.py
          python monitor010/patch_context_clean_046.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.contextclean046/; s/versionCode 2012/versionCode 2046/; s/1.0-failover-012/1.0-context-clean-046/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 046 CONTEXT CLEAN/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          g=Path('android-youtube-test/app/build.gradle').read_text()
          m=Path('android-youtube-test/app/src/main/AndroidManifest.xml').read_text()
          assert 'function platformQuery046()' in h
          assert 'platformQuery045()' not in h[h.index('function gv046CleanGeoPart'):]
          assert 'const sq = platformQuery046();' in h
          assert 'const yq = platformQuery046();' in h
          assert 'const fq=platformQuery046();' in h
          assert "applicationId 'it.geovision.lab.contextclean046'" in g
          assert 'versionCode 2046' in g
          assert 'LAB 046 CONTEXT CLEAN' in m
          print('LAB046 pre-build checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          APK=android-youtube-test/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p out46
          cp "$APK" out46/GeoVision_LAB046_CONTEXT_CLEAN.apk
          cp out/LAB_012_FAILOVER.html out46/GeoVision_LAB046_CONTEXT_CLEAN.html
          cd out46
          zip GeoVision_LAB046_APK.zip GeoVision_LAB046_CONTEXT_CLEAN.apk
          zip GeoVision_LAB046_PACKAGE.zip GeoVision_LAB046_CONTEXT_CLEAN.apk GeoVision_LAB046_CONTEXT_CLEAN.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-046-CONTEXT-CLEAN
          path: |
            out46/GeoVision_LAB046_CONTEXT_CLEAN.apk
            out46/GeoVision_LAB046_APK.zip
            out46/GeoVision_LAB046_PACKAGE.zip
          if-no-files-found: error
