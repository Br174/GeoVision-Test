name: Verify KEYBOX 007 and LAB 010
on:
  push:
    branches: ['work/keybox007-monitor010']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, static and state regression tests
        run: bash monitor010/build.sh
      - name: Browser integration and visual proof
        run: |
          npm install --no-save playwright@1.51.1 leaflet@1.9.4
          npx playwright install --with-deps chromium
          node monitor010/tests/browser.cjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 vault and receiver regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: gradle -p android-keybox connectedDebugAndroidTest
      - name: Package verified deliverables
        run: |
          cp monitor010/REPORT.md out/REPORT.md
          cd out
          zip KEYBOX_007_MONITOR.zip KEYBOX_007_MONITOR.apk REPORT.md
          zip LAB_010_MONITOR_SYNC.zip LAB_010_MONITOR_SYNC.apk LAB_010_MONITOR_SYNC.html Monitor_API_LAB_010.png REPORT.md
          sha256sum *.apk *.html *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GeoVision-KEYBOX007-LAB010-verified
          path: |
            out/KEYBOX_007_MONITOR.apk
            out/KEYBOX_007_MONITOR.zip
            out/LAB_010_MONITOR_SYNC.apk
            out/LAB_010_MONITOR_SYNC.html
            out/LAB_010_MONITOR_SYNC.zip
            out/Monitor_API_LAB_010.png
            out/REPORT.md
            out/SHA256SUMS.txt
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            android-keybox/app/build/reports/
            android-youtube-test/app/build/reports/
