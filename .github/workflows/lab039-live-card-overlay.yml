name: LAB 039 LIVE CARD OVERLAY
on:
  push:
    branches: ['lab/live-card-overlay-039']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build LAB039
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          python monitor010/patch_audioguide_021.py
          python monitor010/patch_facebook_legacy_023.py
          python monitor010/patch_photo_gallery_024.py
          python monitor010/patch_google_card_photo_025.py
          python monitor010/patch_audio_video_back_027.py
          python monitor010/patch_media_googlecard_028.py
          python monitor010/patch_floating_return_029.py
          python monitor010/patch_audio_return_030.py
          python monitor010/patch_persistent_return_audio_031.py
          python monitor010/patch_safe_return_033.py
          python monitor010/patch_youtube_native_return_035.py
          python monitor010/patch_youtube_open_return_036.py
          python monitor010/patch_live_card_overlay_039.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.livecardoverlay039/; s/versionCode 2012/versionCode 2039/; s/1.0-failover-012/1.0-live-card-overlay-039/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 039 LIVE CARD OVERLAY/' android-youtube-test/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          j=Path('android-youtube-test/app/src/main/java/it/geovision/test/MainActivity.java').read_text()
          h=Path('out/LAB_012_FAILOVER.html').read_text()
          assert 'private void returnToGeoVision(){\n        gv039ShowLiveCardOverlay();\n    }' in j
          assert 'gv039OverlayWindow.addView(webView,lp);' in j
          assert 'gv039OverlayWindow.removeView(webView)' in j
          assert '@JavascriptInterface public void dismissOverlay(){gv039DismissLiveCardOverlay();}' in j
          assert "dismissOverlay==='function'" in h
          assert "if(p === 'youtube') gv029ShowReturnBubble();" in h
          assert 'task.moveToFront()' not in j and 'ActivityManager.AppTask' not in j
          assert 'android.permission.SYSTEM_ALERT_WINDOW' in Path('android-youtube-test/app/src/main/AndroidManifest.xml').read_text()
          print('LAB039 live-card overlay checks OK')
          PY
          gradle -p android-youtube-test assembleDebug
          mkdir -p out39
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out39/LAB_039_LIVE_CARD_OVERLAY.apk
          cp out/LAB_012_FAILOVER.html out39/LAB_039_LIVE_CARD_OVERLAY.html
          cd out39 && zip LAB_039_LIVE_CARD_OVERLAY_PACKAGE.zip LAB_039_LIVE_CARD_OVERLAY.apk LAB_039_LIVE_CARD_OVERLAY.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-039-LIVE-CARD-OVERLAY
          path: out39/LAB_039_LIVE_CARD_OVERLAY_PACKAGE.zip
          if-no-files-found: error
