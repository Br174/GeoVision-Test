name: Verify LAB 012 Targeted Failover
on:
  push:
    branches: ['lab/failover-012-targeted']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted build and static guards
        run: bash monitor010/build.sh
      - name: Targeted browser failover verification
        run: |
          npm install --no-save playwright@1.51.1 leaflet@1.9.4
          npx playwright install --with-deps chromium
          node monitor010/tests/browser.cjs
      - name: Package LAB 012
        run: |
          cd out
          printf '%s\n' 'LAB 012 FAILOVER - correzione mirata: Google verificato solo durante uso reale; failover 429 immediato; ON/OFF manuali assoluti; diagnostica Google contraddittoria rimossa.' > README_LAB_012.txt
          zip LAB_012_FAILOVER.zip LAB_012_FAILOVER.apk LAB_012_FAILOVER.html Monitor_API_LAB_012.png README_LAB_012.txt
          sha256sum LAB_012_FAILOVER.apk LAB_012_FAILOVER.html LAB_012_FAILOVER.zip > SHA256SUMS_LAB_012.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-012-FAILOVER-targeted
          path: |
            out/LAB_012_FAILOVER.apk
            out/LAB_012_FAILOVER.html
            out/LAB_012_FAILOVER.zip
            out/Monitor_API_LAB_012.png
            out/README_LAB_012.txt
            out/SHA256SUMS_LAB_012.txt
          if-no-files-found: error
