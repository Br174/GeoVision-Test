name: LAB 020 AUDIOGUIDA
on:
  push:
    branches: ['lab/audioguide-020']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare stable signer
        run: |
          base64 -d android-youtube-test/signing/geovision-debug-stable.keystore.b64 > android-youtube-test/signing/geovision-debug-stable.keystore
          chmod 600 android-youtube-test/signing/geovision-debug-stable.keystore
      - name: Build simple KeyBox
        run: gradle -p android-keybox clean assembleDebug
      - name: Build LAB020 audioguide native
        run: |
          python monitor010/prepare.py
          python monitor010/patch_restore_controls_017.py
          python monitor010/patch_ai_swipe_018.py
          python monitor010/patch_keybox_ai_019.py
          python monitor010/patch_audioguide_020.py
          sed -i "s/it.geovision.lab.failover012/it.geovision.lab.audioguide020/; s/versionCode 2012/versionCode 2020/; s/1.0-failover-012/1.0-audioguide-020/" android-youtube-test/app/build.gradle
          sed -i 's/LAB 012 FAILOVER/LAB 020 AUDIOGUIDA/' android-youtube-test/app/src/main/AndroidManifest.xml
          gradle -p android-youtube-test assembleDebug
          mkdir -p out20
          cp android-keybox/app/build/outputs/apk/debug/app-debug.apk out20/GeoVision_KEYBOX_009_SIMPLE.apk
          cp android-youtube-test/app/build/outputs/apk/debug/app-debug.apk out20/LAB_020_AUDIOGUIDA.apk
          cp out/LAB_012_FAILOVER.html out20/LAB_020_AUDIOGUIDA.html
          grep -q 'GeoVisionAI.generate' out20/LAB_020_AUDIOGUIDA.html
          grep -q 'window.gvNativeAiResult' out20/LAB_020_AUDIOGUIDA.html
          unzip -p out20/LAB_020_AUDIOGUIDA.apk classes.dex | strings | grep -q 'GeoVisionAI'
          cd out20 && zip LAB_020_AUDIOGUIDA_PACKAGE.zip GeoVision_KEYBOX_009_SIMPLE.apk LAB_020_AUDIOGUIDA.apk LAB_020_AUDIOGUIDA.html
      - uses: actions/upload-artifact@v4
        with:
          name: LAB-020-AUDIOGUIDA
          path: out20/LAB_020_AUDIOGUIDA_PACKAGE.zip
